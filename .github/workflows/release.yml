name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        # Run it with --ref set to the same tag: the signing key is only handed to tag refs.
        description: Existing tag to build and attach the APK to
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  apk:
    name: Signed APK
    runs-on: ubuntu-latest
    # The environment holds the signing key and only admits tags matching v*.
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21 compiles (jvmToolchain), 25 runs the Gradle daemon (gradle-daemon-jvm.properties).
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Tag matches versionName
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' androidApp/build.gradle.kts)
          if [ "v$name" != "$TAG" ]; then
            echo "::error::versionName is $name, tag is $TAG"
            exit 1
          fi
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          TEETOTUM_APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          TEETOTUM_APP_KEY_ALIAS: teetotum-app
        run: |
          export TEETOTUM_APP_KEYSTORE="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$TEETOTUM_APP_KEYSTORE"
          ./gradlew --console=plain :shared:testAndroidHostTest :androidApp:assembleRelease
          rm "$TEETOTUM_APP_KEYSTORE"
      - name: Check the signature
        run: |
          mkdir dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/teetotum-app-$TAG.apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "dist/teetotum-app-$TAG.apk"
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
      - name: Release notes from the changelog
        run: |
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "TeeToTum app $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" dist/* --clobber

  manual:
    name: User manual
    # The release exists once the APK job has published it.
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pandoc/actions/setup@v1
        with:
          version: 3.7.0.2
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Build
        run: docs/manual/build.sh "teetotum-manual-$TAG.pdf"
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        # SHA256SUMS comes from the APK job; the manual's line joins it, once.
        run: |
          pdf="teetotum-manual-$TAG.pdf"
          gh release download "$TAG" --pattern SHA256SUMS --clobber
          grep -v -F -- "  $pdf" SHA256SUMS > sums || true
          sha256sum -- "$pdf" >> sums
          mv sums SHA256SUMS
          gh release upload "$TAG" "$pdf" SHA256SUMS --clobber

  citation:
    name: Citation version
    # Only a new tag moves the citation; building an older tag again leaves it alone.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set version and release date in CITATION.cff
        run: |
          version="${TAG#v}"
          current=$(sed -n 's/^version: //p' CITATION.cff)
          if [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "CITATION.cff names $current, newer than $version"
            exit 0
          fi
          date=$(git log -1 --format=%cs "$TAG")
          sed -i "s/^version: .*/version: $version/" CITATION.cff
          if grep -q '^date-released:' CITATION.cff; then
            sed -i "s/^date-released: .*/date-released: \"$date\"/" CITATION.cff
          else
            sed -i "/^version: /a date-released: \"$date\"" CITATION.cff
          fi
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898187+github-actions[bot]@users.noreply.github.com"
          git commit -am "Cite version $version"
          git push
